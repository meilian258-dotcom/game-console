plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.141' }
apply from: '../source-control/neoforge-compat.gradle'
apply from: '../source-control/snapshot-resources.gradle'
group = 'cn.piq.mdhome'
version = mod_version
base { archivesName = 'game_console_md' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = neo_version; mods { piq_md_home { sourceSet(sourceSets.main) } } }
repositories { mavenCentral() }
def fc = files(providers.gradleProperty('gameConsoleJar').getOrElse('../piq-fc-arcade/build/libs/piq_fc_arcade-0.31.0-alpha.76.36.jar'))
dependencies {
    implementation fc
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def asciiRoot = new File(System.getProperty('java.io.tmpdir'), 'piq-md-home-tests')
def stageTests = tasks.register('stageAsciiTests', Sync) { dependsOn testClasses; from sourceSets.test.output; into new File(asciiRoot,'tests') }
def stageMain = tasks.register('stageAsciiMain', Sync) { dependsOn classes; from sourceSets.main.output; into new File(asciiRoot,'main') }
def stageDeps = tasks.register('stageAsciiDeps', Sync) { from sourceSets.main.compileClasspath; into new File(asciiRoot,'dependencies') }
test {
    dependsOn stageTests,stageMain,stageDeps
    useJUnitPlatform()
    classpath=files(new File(asciiRoot,'tests'),new File(asciiRoot,'main'))+fileTree(new File(asciiRoot,'dependencies'))+configurations.testRuntimeClasspath.filter { !fc.files.contains(it) }
}
def verifyCores = tasks.register('verifyCores') {
    doLast {
        ['genesis_plus_gx_libretro.dll':'9ffa10a115b20e1b49e9caf0b53f287c640ed4e5bb93f7ed9a23b416a4ccfdf7',
         'genesis_plus_gx_piq_netplay_libretro.dll':'8200a6d5e7c39f60afefd8e87e369d253f737de6a73bf8d920d2ab81888a5fb5'].each { name, sha ->
            def resources = providers.gradleProperty('snapshotResourcesDir').getOrElse('src/main/resources')
            def input = file(resources + '/core/windows-x64/' + name)
            if(!input.isFile() || input.length() > 32 * 1024 * 1024 ||
                java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString() != sha)
                throw new GradleException('Pinned MD core missing/mismatched: ' + name + '; see tools/prepare_genesis.py, native-genesis-netplay/README.md and README')
        }
    }
}
processResources.dependsOn verifyCores
tasks.named('processResources', ProcessResources) {
    // Keep historical source/receipt/license files; never copy the retired executable into a new build.
    exclude '**/blastem_libretro.dll'
    doFirst {
        // Copy tasks do not remove excluded files from a previous incremental build.
        delete new File(destinationDir, 'core/windows-x64/blastem_libretro.dll')
    }
    inputs.properties(version: project.version, neo_min_version: neo_min_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version, neo_min_version: neo_min_version)
    }
}
jar {
    exclude '**/blastem_libretro.dll'
    manifest { attributes 'Implementation-Title': 'Game Console MD', 'Implementation-Version': project.version }
}
