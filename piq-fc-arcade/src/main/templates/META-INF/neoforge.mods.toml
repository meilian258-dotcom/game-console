modLoader="javafml"
loaderVersion="[4,)"
license="GPL-3.0-or-later (code); assets separately licensed"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="PIQ"
enumExtensions="META-INF/piq-fc-controller-enumextensions.json"
description='''Play legally owned FC/NES ROMs on arcade machines in Minecraft.'''

[[mixins]]
config="piq_fc_keyboard.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},22)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="waterframes"
type="optional"
versionRange="[2.1.23,3)"
ordering="AFTER"
side="BOTH"

# Old addons lack Netplay save grants (or use pre-migration roots). Refuse incompatible combinations.
[[dependencies.${mod_id}]]
modId="piq_sfc_home"
type="incompatible"
versionRange="(,0.1.0-alpha.42)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="piq_native_arcade"
type="incompatible"
versionRange="(,0.1.5.3)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="piq_gba"
type="incompatible"
versionRange="(,0.1.0-alpha.9)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="piq_flash_box"
type="incompatible"
versionRange="(,0.1.0-alpha.9)"
ordering="NONE"
side="BOTH"
