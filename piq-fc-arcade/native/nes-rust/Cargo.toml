[package]
name = "nes_rust"
version = "0.1.2"
description = "NES emulator written in Rust"
authors = ["Takahiro <hogehoge@gachapin.jp>"]
edition = "2015"
license = "MIT"
homepage = "https://github.com/takahirox/nes-rust"
repository = "https://github.com/takahirox/nes-rust"
exclude = [
  "resources/*",
  "screenshots/*",
  "roms/*",
  "cli/*",
  "wasm/*"
]

[features]
default = []
# Separate experimental module only. Never enabled for the legacy released WASM.
zapper = []

[workspace]
members = [".", "ffi"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[badges]
travis-ci = {repository = "takahirox/nes-rust"}
