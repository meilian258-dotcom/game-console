plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}
apply from: '../source-control/neoforge-compat.gradle'
group = 'cn.piq.sfchome'
version = mod_version
base { archivesName = 'piq_sfc_home' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Protocol tests exercise the real Minecraft/Netty codecs, not local stubs.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
neoForge {
    version = neo_version
    mods { piq_sfc_home { sourceSet(sourceSets.main) } }
}
repositories { mavenCentral() }
def localModJars = files(providers.gradleProperty('gameConsoleJar').getOrElse('../piq-fc-arcade/build/libs/piq_fc_arcade-0.31.0-alpha.76.41.jar'),
        providers.gradleProperty('sfcCoreJar').getOrElse('../piq-sfc-arcade/build/libs/piq_sfc_arcade-0.2.0-alpha.10.jar'))
dependencies {
    implementation localModJars
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def metadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(version: project.version, neo_min_version: neo_min_version)
    expand(version: project.version, neo_min_version: neo_min_version)
    from 'src/main/templates'
    into 'build/generated/modMetadata'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
def asciiRoot = new File(System.getProperty('java.io.tmpdir'), 'piq-sfc-home-tests')
def asciiTests = new File(asciiRoot, 'tests')
def asciiMain = new File(asciiRoot, 'main')
def asciiDependencies = new File(asciiRoot, 'dependencies')
def copyDependencies = tasks.register('prepareAsciiModDependencies', Sync) {
    // Keep Minecraft and mod JARs on ASCII paths for Windows Gradle workers.
    from sourceSets.main.compileClasspath; into asciiDependencies
}
def copyTests = tasks.register('prepareAsciiTestOutput', Sync) {
    dependsOn tasks.named('testClasses'); from sourceSets.test.output; into asciiTests
}
def copyMain = tasks.register('prepareAsciiMainOutput', Sync) {
    dependsOn tasks.named('classes'); from sourceSets.main.output; into asciiMain
}
tasks.named('test', Test) {
    dependsOn copyTests, copyMain, copyDependencies
    useJUnitPlatform()
    classpath = files(asciiTests, asciiMain) + fileTree(asciiDependencies) + configurations.testRuntimeClasspath.filter { !localModJars.files.contains(it) }
}
jar {
    from('LICENSE') { into 'META-INF' }
    // Internal thin build. Package with the reviewed core10 using the explicit
    // merge procedure in the current delivery guide; preserve both legacy mod IDs.
    // FC owns the public platform and runtime: do not embed duplicate copies.
    manifest { attributes 'Implementation-Title': 'Game Console: SFC', 'Implementation-Version': project.version }
}
