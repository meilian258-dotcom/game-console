plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.141' }
group = 'cn.piq.pvz'
version = '0.1.0-prototype.11'
base { archivesName = 'game_console_pvz' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.236'
    mods { piq_pvz { sourceSet(sourceSets.main) } }
}
repositories { mavenCentral() }
dependencies {
    implementation files('../piq-fc-arcade/build/libs/piq_fc_arcade-0.31.0-alpha.76.22.jar')
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.apache.maven:maven-artifact:3.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
def metadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.property 'version', project.version
    expand(version: project.version)
    from 'src/main/templates'; into 'build/generated/modMetadata'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
def asciiRoot = new File(System.getProperty('java.io.tmpdir'), 'piq-pvz-tests')
def prepareMain = tasks.register('prepareAsciiMain', Sync) { dependsOn tasks.named('classes'); from sourceSets.main.output; into new File(asciiRoot,'main') }
def prepareTests = tasks.register('prepareAsciiTests', Sync) { dependsOn tasks.named('testClasses'); from sourceSets.test.output; into new File(asciiRoot,'tests') }
def prepareDependencies = tasks.register('prepareAsciiDependencies', Sync) {
    from sourceSets.main.compileClasspath
    into new File(asciiRoot,'dependencies')
}
tasks.named('test', Test) {
    dependsOn prepareMain, prepareTests, prepareDependencies
    useJUnitPlatform()
    testClassesDirs=files(new File(asciiRoot,'tests'))
    classpath=files(new File(asciiRoot,'tests'),new File(asciiRoot,'main'))+fileTree(new File(asciiRoot,'dependencies'))+configurations.testRuntimeClasspath.filter{!it.name.startsWith('game_console-')}
}
jar { from(files('LICENSE','THIRD_PARTY.md')) { into 'META-INF' } }
