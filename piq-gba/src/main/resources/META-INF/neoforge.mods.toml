description='''Portable GBA handheld with physical cartridges copied at the retro computer. Right-click raises/lowers without powering off; Shift+right-click inserts a cartridge held in the other hand, otherwise toggles power. Shift+left-click safely ejects after battery saving. Windows x64 defaults to common JNI with isolated battery saves and explicit process fallback. One-seat cabinet and hosted JNI remain separate from the personal handheld. No GBA link or Netplay. See capability and risk guide.'''
