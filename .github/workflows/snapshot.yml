name: Build and publish snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_only:
        description: Build and validate only; do not upload binaries or publish a Release
        type: boolean
        required: true
        default: true

# No PR event, personal token, self-hosted runner or persistent credential cache.
permissions:
  contents: read

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.repository == 'meilian258-dotcom/game-console' &&
       github.event_name == 'workflow_dispatch' &&
       startsWith(github.ref, 'refs/heads/') && inputs.validation_only == true)
    runs-on: windows-2022
    timeout-minutes: 120
    concurrency:
      group: snapshot-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: microsoft
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test the source and release guardrails
        run: python -B -m unittest discover -s source-control -p 'test_*.py'
      - name: Audit the source checkout
        run: python source-control/audit.py --staged
      - name: Download and verify build inputs
        run: python source-control/snapshot_inputs.py --output .snapshot-build/inputs
      - name: Compile, test and package the seven mods
        run: python source-control/snapshot_build.py --work .snapshot-build --output snapshot-dist
      - name: Validate the exact release file set
        run: python source-control/snapshot_release.py --directory snapshot-dist --validate-only
        env:
          SNAPSHOT_VALIDATION_ONLY: ${{ inputs.validation_only }}
      - name: Record validation-only scope
        if: always() && github.event_name == 'workflow_dispatch' && inputs.validation_only == true
        shell: pwsh
        run: |
          @'
          ## Validation only
          This run checks the main/nightly snapshot build chain, not a fixed-core release candidate.
          No player JARs, native runtimes or build directories are uploaded as Actions artifacts.
          The Release publishing job is disabled for this run.
          Build results do not grant distribution approval or imply Minecraft acceptance.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Transfer only the reviewed release assets
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.validation_only == false))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            snapshot-dist/*.jar
            snapshot-dist/manifest.json
            snapshot-dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          include-hidden-files: false

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && needs.build.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.validation_only == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    # Job-level concurrency does not cancel a release transaction when a newer
    # build starts. A partial upload remains a draft, never a public release.
    concurrency:
      group: snapshot-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out only the trusted publisher sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          sparse-checkout: source-control
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download this run's build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-dist
      - name: Verify assets and publish a new snapshot prerelease
        run: python source-control/snapshot_release.py --directory snapshot-dist
        env:
          SNAPSHOT_VALIDATION_ONLY: ${{ inputs.validation_only }}
          GH_TOKEN: ${{ github.token }}
